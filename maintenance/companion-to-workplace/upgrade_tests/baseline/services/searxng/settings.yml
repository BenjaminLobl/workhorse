use_default_settings: true
server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
search:
  safe_search: 1
  formats:
    - html
    - json
outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
engines:
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
